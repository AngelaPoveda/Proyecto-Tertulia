<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Registro | Tertulia Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
    <link rel="icon" th:href="@{/img/logo.jpg}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body id="login-page">
    <a href="/" class="btn-volver">
        <i class="bi bi-house-door"></i> Volver al inicio
    </a>
    <section class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card-login" style="max-width: 450px; width: 100%;">
            <h2 class="text-center mb-4 fw-bold" style="color: var(--color-marron);">
                Crea tu cuenta en <span style="color: var(--color-marron-oscuro);">Tertulia</span>
            </h2>

            <form th:action="@{/usuarios/registro}" th:object="${usuario}" method="post" class="p-3 needs-validation" novalidate>

                <!-- NOMBRE COMPLETO -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                        placeholder="Ejemplo: Ana Torres"
                        th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>

                <!-- NOMBRE DE USUARIO -->
                <div class="mb-3">
                    <label for="usuario" class="form-label">Nombre de usuario</label>
                    <input type="text" th:field="*{nombreUsuario}" class="form-control"
                        th:classappend="${#fields.hasErrors('nombreUsuario')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreUsuario')}"
                        th:errors="*{nombreUsuario}"></div>
                </div>

                <!-- CORREO ELECTRÓNICO -->
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" th:field="*{correo}" class="form-control"
                        placeholder="tucorreo@gmail.com"
                        th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:errors="*{correo}"></div>
                </div>

                <!-- CONTRASEÑA -->
                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" id="contrasena" th:field="*{contrasena}" class="form-control"
                        placeholder="********" th:classappend="${#fields.hasErrors('contrasena')} ? 'is-invalid' : ''"
                        required>
                    <div class="invalid-feedback" th:errors="*{contrasena}"></div>
                </div>

                <!-- TELÉFONO -->
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="text" id="telefono" th:field="*{telefono}" class="form-control" placeholder="999999999"
                        th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{telefono}"></div>
                </div>

                <button type="submit" class="btn btn-marron w-100 py-2 mt-3">Registrarme</button>

                <p class="text-center mt-4 mb-0">
                    ¿Ya tienes cuenta?
                    <a th:href="@{/login}" class="link-marron">Inicia sesión</a>
                </p>

            </form>


        </div>
    </section>



</body>

</html>
