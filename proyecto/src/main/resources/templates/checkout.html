<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Finalizar Compra - Tertulia Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" th:href="@{/img/logo.jpg}" type="image/x-icon">
    <style>
        .checkout-container {
            max-width: 600px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin: 3rem auto;
        }

        .mapa iframe {
            border-radius: 10px;
            width: 100%;
            height: 300px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-marron fixed-top shadow-sm">
        <div class="container">
            <a th:href="@{/carrito}" class="btn btn-link text-white p-0">
                <i class="bi bi-arrow-left fs-4"></i>
            </a>
            <span class="navbar-text mx-auto fw-semibold text-white">
                Finalizar compra
            </span>
        </div>
    </nav>


    <!-- Contenedor principal -->
    <section class="checkout-container">
        <h2 class="text-center mb-4">Finalizar compra 🛍️</h2>

        <form id="formCheckout" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej. Ana Poveda" required>
                <div class="invalid-feedback">Por favor ingresa tu nombre completo.</div>
            </div>

            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" id="telefono" class="form-control" placeholder="987654321" required
                    pattern="[0-9]{9}">
                <div class="invalid-feedback">Ingresa un número de 9 dígitos.</div>
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección de entrega</label>
                <input type="text" id="direccion" class="form-control" placeholder="Av. España 450 - Trujillo" required>
                <div class="invalid-feedback">Por favor ingresa tu dirección.</div>
            </div>

            <div class="mb-4">
                <label for="pago" class="form-label">Método de pago</label>
                <select id="pago" class="form-select" required>
                    <option value="">Selecciona una opción...</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Yape">Yape</option>
                    <option value="Efectivo">Efectivo</option>
                </select>
                <div class="invalid-feedback">Selecciona un método de pago.</div>
            </div>
            <button type="submit" class="btn btn-marron w-100 py-2">Confirmar pedido</button>
        </form>

        <div class="mapa mt-4">
            <iframe src="https://www.google.com/maps?q=Trujillo,Perú&output=embed" allowfullscreen="" loading="lazy">
            </iframe>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/checkout.js}"></script>
</body>

</html>
