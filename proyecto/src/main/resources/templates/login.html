<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Iniciar Sesión | Tertulia Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
    <link rel="icon" th:href="@{/img/logo.jpg}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body id="login-page">
    <a href="/" class="btn-volver">
        <i class="bi bi-house-door"></i> Volver al inicio
    </a>

    <section class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card-login" style="max-width: 420px; width: 100%;">
            <h2 class="text-center mb-4 fw-bold" style="color: var(--color-marron);">
                Bienvenido a <span style="color: var(--color-marron-oscuro);">Tertulia ☕</span>
            </h2>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" id="usuario" class="form-control" placeholder="Tu nombre de usuario" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="********" required>
                </div>

                <button type="submit" class="btn btn-marron w-100 py-2 mt-3">Iniciar Sesión</button>

                <p class="text-center mt-4 mb-0">
                    ¿No tienes cuenta?
                    <a th:href="@{/registro}" class="link-marron">Regístrate aquí</a>
                </p>
            </form>
        </div>
    </section>

    <script>
        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const nombre = document.getElementById("usuario").value;
            localStorage.setItem("usuario", nombre);
            window.location.href = "/";
        });
    </script>

</body>

</html>
